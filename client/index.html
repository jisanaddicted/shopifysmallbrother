<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Order products online and track your rider live on the map."
    />
    <title>Delivery App</title>

    <!--
      Leaflet's stylesheet is NOT loaded here. It used to be a render-blocking
      <link> in this head, pulled from unpkg, which made every page wait on a
      third-party request for a stylesheet that only four pages need. It now
      travels with the map components (see components/maps/AddressPickerMap.jsx)
      and Vite emits it into the lazily-imported chunk, so it is fetched only
      when a page actually draws a map.
    -->
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Surface boot-time crashes instead of a silent white page: if the
      // app throws before React paints anything, show the error in #root.
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root || root.childElementCount) return;
        var message =
          (event && event.error && event.error.message) ||
          (event && event.message) ||
          'Unknown error';
        var box = document.createElement('pre');
        box.style.cssText =
          'padding:16px;margin:16px;color:#b91c1c;white-space:pre-wrap;font-family:monospace';
        box.textContent = 'The app failed to start:\n' + message;
        root.appendChild(box);
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
