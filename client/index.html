<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Order products online and track your rider live on the map."
    />
    <title>Delivery App</title>

    <!--
      Leaflet's stylesheet MUST be loaded before the map is rendered.
      Loading it here (instead of importing it in JS) keeps it out of the
      React bundle and lets the browser start fetching it immediately.
    -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Surface boot-time crashes instead of a silent white page: if the
      // app throws before React paints anything, show the error in #root.
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root || root.childElementCount) return;
        var message =
          (event && event.error && event.error.message) ||
          (event && event.message) ||
          'Unknown error';
        var box = document.createElement('pre');
        box.style.cssText =
          'padding:16px;margin:16px;color:#b91c1c;white-space:pre-wrap;font-family:monospace';
        box.textContent = 'The app failed to start:\n' + message;
        root.appendChild(box);
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
