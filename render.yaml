services:
  - type: web
    name: ronex-mart
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix client && npm --prefix client run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
